<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFW Fuel Map</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mut:#6b7280;--line:#e3e6ea;--map:#e9edf1;--road:#fff;--roadl:#c9d0d8;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--tx:#eef1f5;--mut:#8b95a3;--line:#262d37;--map:#1b222b;--road:#2c3541;--roadl:#3a4552;--acc:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--tx:#eef1f5;--mut:#8b95a3;--line:#262d37;--map:#1b222b;--road:#2c3541;--roadl:#3a4552;--acc:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px 6px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #22c55e88}100%{box-shadow:0 0 0 8px #22c55e00}}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--tx);padding:8px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
input.q{flex:1;min-width:140px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit}
main{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:0 16px 16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.mapw{position:relative;background:var(--map);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:min(72vh,720px);min-height:340px}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.grad{width:70px;height:6px;border-radius:3px;background:linear-gradient(90deg,hsl(140 70% 42%),hsl(70 80% 45%),hsl(0 75% 50%))}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;height:min(72vh,720px);min-height:300px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.rk{width:22px;color:var(--mut);font-size:12px;text-align:center}
.inf{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:12px;color:var(--mut)}
.pr{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.flash{animation:f 1.2s}@keyframes f{0%{background:#facc1566}100%{background:transparent}}
.note{padding:0 16px 20px;font-size:12px;color:var(--mut)}
.pin text{font:700 11px system-ui,sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}
.pin{cursor:pointer}
.city{font:600 11px system-ui;fill:var(--mut);text-anchor:middle;pointer-events:none;opacity:.8}
</style>
</head>
<body>
<header><h1>⛽ DFW Fuel Map</h1><div class="live"><span class="dot"></span><span id="upd">Live · updated just now</span></div></header>
<div class="bar">
  <div class="seg" id="fuel"><button class="on" data-f="reg">Regular</button><button data-f="mid">Midgrade</button><button data-f="pre">Premium</button><button data-f="dsl">Diesel</button></div>
  <input class="q" id="q" placeholder="Search city or brand…">
  <div class="seg" id="sort"><button class="on" data-s="price">Cheapest</button><button data-s="dist">Nearest</button></div>
  <button class="btn" id="loc">📍 Locate me</button>
</div>
<main>
  <div class="mapw">
    <svg id="svg" viewBox="0 0 882 900"><g id="base"></g><g id="pins"></g><g id="me"></g></svg>
    <div class="zoom"><button id="zi">+</button><button id="zo">−</button></div>
    <div class="legend">Cheaper <span class="grad"></span> Pricier</div>
  </div>
  <div class="list" id="list"></div>
</main>
<p class="note">Demo data: prices and stations are simulated and drift every few seconds to show live tracking. Connect a real fuel-price feed to go live.</p>
<script>
const P=(a,b)=>[(b+97.5)*840,(33.4-a)*1000];
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg"),base=document.getElementById("base"),pinsG=document.getElementById("pins"),meG=document.getElementById("me");
const roads={
"I-35E":[[33.21,-97.09],[33.05,-96.97],[32.9,-96.9],[32.78,-96.82],[32.6,-96.85],[32.45,-96.85]],
"I-35W":[[33.2,-97.14],[33,-97.3],[32.8,-97.33],[32.65,-97.33],[32.5,-97.32]],
"I-30":[[32.75,-97.45],[32.75,-97.33],[32.76,-97.08],[32.78,-96.8],[32.82,-96.55],[32.9,-96.45]],
"I-20":[[32.65,-97.45],[32.66,-97.2],[32.67,-96.95],[32.68,-96.8],[32.72,-96.55],[32.78,-96.45]],
"I-635":[[32.87,-96.99],[32.92,-96.88],[32.93,-96.75],[32.9,-96.65],[32.82,-96.6],[32.72,-96.58]],
"US-75":[[32.78,-96.8],[32.95,-96.73],[33.1,-96.67],[33.2,-96.62]],
"DNT":[[32.78,-96.8],[32.95,-96.84],[33.1,-96.82],[33.25,-96.8],[33.35,-96.78]],
"SH-121":[[32.8,-97.15],[32.93,-97],[33,-96.9],[33.1,-96.82]],
"I-45":[[32.78,-96.8],[32.6,-96.72],[32.45,-96.65]]};
for(const k in roads){const d=roads[k].map((p,i)=>(i?"L":"M")+P(...p).join(" ")).join("");
 for(const [w,c] of [[7,"var(--roadl)"],[4.5,"var(--road)"]]){const e=document.createElementNS(NS,"path");e.setAttribute("d",d);e.setAttribute("fill","none");e.setAttribute("stroke",c);e.setAttribute("stroke-width",w);e.setAttribute("stroke-linecap","round");e.setAttribute("stroke-linejoin","round");base.appendChild(e)}}
const cities=[["Dallas",32.7767,-96.797],["Fort Worth",32.7555,-97.3308],["Plano",33.0198,-96.6989],["Frisco",33.1507,-96.8236],["McKinney",33.1972,-96.6398],["Arlington",32.7357,-97.1081],["Irving",32.814,-96.9489],["Garland",32.9126,-96.6389],["Denton",33.2148,-97.1331],["Celina",33.3243,-96.7845],["Mesquite",32.7668,-96.5992],["Lewisville",33.0462,-96.9942],["Mansfield",32.5632,-97.1417],["Southlake",32.9412,-97.1342]];
cities.forEach(([n,a,b])=>{const [x,y]=P(a,b);const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y+30);t.setAttribute("class","city");t.setAttribute("style","font-size:14px;font-weight:700;opacity:.55");t.textContent=n;base.appendChild(t)});

const B={Shell:"#e8a317",Chevron:"#1d6fd1",Exxon:"#d92d2d",QuikTrip:"#c4262e",Buc_ees:"#e0a100",Costco:"#1f4fa3",Sams:"#0b6bb5",Murphy:"#15803d",RaceTrac:"#e11d48",Valero:"#2563eb",Kroger:"#1e40af"};
const S=[
["Costco","Costco Gas","Frisco",33.1,-96.84,-.22],["QuikTrip","QuikTrip #412","Dallas",32.79,-96.77,-.05],["Buc_ees","Buc-ee’s","Denton",33.19,-97.1,-.12],
["Sams","Sam’s Club Fuel","Plano",33.03,-96.74,-.17],["Shell","Shell Uptown","Dallas",32.8,-96.8,.15],["Chevron","Chevron Love Field","Dallas",32.84,-96.85,.12],
["Exxon","Exxon Preston Rd","Plano",33.05,-96.8,.04],["RaceTrac","RaceTrac Main St","Fort Worth",32.75,-97.33,-.08],["Valero","Valero Cooper St","Arlington",32.72,-97.1,-.1],
["Murphy","Murphy USA","Garland",32.91,-96.64,-.18],["QuikTrip","QuikTrip Belt Line","Irving",32.86,-96.95,-.04],["Kroger","Kroger Fuel","McKinney",33.2,-96.65,-.14],
["Shell","Shell Legacy","Plano",33.08,-96.82,.07],["Costco","Costco Gas","Fort Worth",32.67,-97.39,-.2],["Exxon","Exxon Hwy 380","Celina",33.32,-96.78,.02],
["Chevron","Chevron Southlake","Southlake",32.94,-97.14,.18],["Valero","Valero Mansfield","Mansfield",32.57,-97.14,-.09],["RaceTrac","RaceTrac Grand Prairie","Grand Prairie",32.75,-97,-.07],
["Murphy","Murphy USA","Lewisville",33.05,-96.99,-.16],["Shell","Shell Deep Ellum","Dallas",32.78,-96.78,.2],["QuikTrip","QuikTrip Mesquite","Mesquite",32.77,-96.6,-.06],
["Sams","Sam’s Club Fuel","Allen",33.1,-96.67,-.15],["Kroger","Kroger Fuel","Richardson",32.95,-96.73,-.11],["Exxon","Exxon Addison","Addison",32.96,-96.83,.09],
["Buc_ees","Buc-ee’s","Prosper",33.24,-96.8,-.1],["Chevron","Chevron Carrollton","Carrollton",32.95,-96.89,.01],["Valero","Valero Duncanville","Dallas",32.65,-96.9,-.12],
["Shell","Shell Fort Worth Stockyards","Fort Worth",32.79,-97.35,.06],["RaceTrac","RaceTrac Denton","Denton",33.22,-97.14,-.05],["Murphy","Murphy USA","Frisco",33.15,-96.85,-.13]
].map((s,i)=>({id:i,brand:s[0],name:s[1],city:s[2],lat:s[3],lng:s[4],reg:+(2.88+s[5]).toFixed(2),flash:0}));
const OFF={reg:0,mid:.45,pre:.85,dsl:.62};
let fuel="reg",sort="price",sel=null,user={lat:32.7767,lng:-96.797,real:false},filt="",lastTick=Date.now();
const price=s=>+(s.reg+OFF[fuel]+((s.id*7)%5)*.01).toFixed(2);
const dist=s=>{const R=3959,r=Math.PI/180,dl=(s.lat-user.lat)*r,dn=(s.lng-user.lng)*r;const a=Math.sin(dl/2)**2+Math.cos(user.lat*r)*Math.cos(s.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(a))};
const hue=(p,lo,hi)=>140*(1-(hi==lo?0:(p-lo)/(hi-lo)));

let view={x:0,y:0,w:882,h:900};
const k=()=>Math.max(view.w/svg.clientWidth,view.h/svg.clientHeight);
const setView=()=>{svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);placePins()};
function zoom(f,cx,cy){cx=cx??view.x+view.w/2;cy=cy??view.y+view.h/2;const nw=Math.min(882,Math.max(90,view.w*f)),r=nw/view.w;view={x:cx-(cx-view.x)*r,y:cy-(cy-view.y)*r,w:nw,h:view.h*r};setView()}
document.getElementById("zi").onclick=()=>zoom(.6);document.getElementById("zo").onclick=()=>zoom(1.6);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect(),s=k();zoom(e.deltaY<0?.85:1.18,view.x+(e.clientX-r.left)*s,view.y+(e.clientY-r.top)*s)},{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,m:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.m=true;if(drag.m){const s=k();view.x=drag.vx-dx*s;view.y=drag.vy-dy*s;setView()}});
svg.addEventListener("pointerup",()=>{setTimeout(()=>drag=null,0)});

const pinEls={};
function visible(){const q=filt.toLowerCase();return S.filter(s=>!q||(s.city+s.name+s.brand).toLowerCase().includes(q.replace("’","'")))}
function render(){
 const vs=visible(),ps=vs.map(price),lo=Math.min(...ps),hi=Math.max(...ps);
 pinsG.innerHTML="";
 vs.forEach(s=>{const p=price(s),g=document.createElementNS(NS,"g");g.setAttribute("class","pin");
  g.innerHTML=`<path d="M0 0L-5 -9H5Z" fill="hsl(${hue(p,lo,hi)} 70% 40%)"/><rect x="-22" y="-27" width="44" height="19" rx="9" fill="hsl(${hue(p,lo,hi)} 70% 42%)" stroke="${sel===s.id?"var(--tx)":"#fff"}" stroke-width="${sel===s.id?2.5:1.5}"/><text y="-13.5">${p.toFixed(2)}</text>`;
  g.onclick=()=>{if(!drag||!drag.m)select(s.id,false)};pinsG.appendChild(g);pinEls[s.id]=g});
 placePins();
 const rows=vs.map(s=>({s,p:price(s),d:dist(s)})).sort((a,b)=>sort=="price"?a.p-b.p:a.d-b.d);
 const L=document.getElementById("list");L.innerHTML="";
 rows.forEach((r,i)=>{const d=document.createElement("div");d.className="row"+(sel===r.s.id?" sel":"")+(Date.now()-r.s.flash<1300?" flash":"");
  d.innerHTML=`<span class="rk">${i+1}</span><span style="width:10px;height:10px;border-radius:50%;background:${B[r.s.brand]}"></span><div class="inf"><div class="nm">${r.s.name}</div><div class="sb">${r.s.city} · ${r.d.toFixed(1)} mi</div></div><div class="pr" style="color:hsl(${hue(r.p,lo,hi)} 65% 42%)">$${r.p.toFixed(2)}</div>`;
  d.onclick=()=>select(r.s.id,true);L.appendChild(d)});
 if(!rows.length)L.innerHTML='<div class="row"><div class="sb">No stations match.</div></div>';
}
function placePins(){const s=k();for(const id in pinEls){const st=S[id],[x,y]=P(st.lat,st.lng);if(pinEls[id].isConnected)pinEls[id].setAttribute("transform",`translate(${x} ${y}) scale(${s})`)}
 const [ux,uy]=P(user.lat,user.lng);meG.innerHTML=user.real?`<g transform="translate(${ux} ${uy}) scale(${s})"><circle r="14" fill="#2563eb33"/><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/></g>`:""}
function select(id,center){sel=id;if(center){const s=S[id],[x,y]=P(s.lat,s.lng);const w=Math.min(view.w,260);view={x:x-w/2,y:y-w*view.h/view.w/2,w,h:w*view.h/view.w};setView()}render()}
document.getElementById("fuel").onclick=e=>{if(!e.target.dataset.f)return;fuel=e.target.dataset.f;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b==e.target));render()};
document.getElementById("sort").onclick=e=>{if(!e.target.dataset.s)return;sort=e.target.dataset.s;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b==e.target));render()};
document.getElementById("q").oninput=e=>{filt=e.target.value;render()};
document.getElementById("loc").onclick=()=>{const b=document.getElementById("loc");
 if(!navigator.geolocation){b.textContent="Location unavailable";return}
 navigator.geolocation.getCurrentPosition(p=>{user={lat:p.coords.latitude,lng:p.coords.longitude,real:true};sort="dist";document.querySelectorAll("#sort button").forEach(x=>x.classList.toggle("on",x.dataset.s=="dist"));const [x,y]=P(user.lat,user.lng);if(x>0&&x<882&&y>0&&y<900){view={x:x-150,y:y-150*view.h/view.w,w:300,h:300*view.h/view.w};setView()}render()},()=>{b.textContent="📍 Location blocked"},{enableHighAccuracy:true,timeout:8000})};
// live drift
setInterval(()=>{for(let i=0;i<4;i++){const s=S[Math.floor(Math.random()*S.length)];s.reg=+Math.max(2.4,s.reg+(Math.random()<.5?-1:1)*(.01+Math.random()*.03)).toFixed(2);s.flash=Date.now()}lastTick=Date.now();render()},4000);
setInterval(()=>{const n=Math.round((Date.now()-lastTick)/1000);document.getElementById("upd").textContent="Live · updated "+(n<2?"just now":n+"s ago")},1000);
addEventListener("resize",placePins);
render();
</script>
</body>
</html>
